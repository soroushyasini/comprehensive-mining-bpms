<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>مدیریت شرکت‌ها</title>
  <style>
    :root { --navy:#17324d; --blue:#2474a8; --line:#dbe4ec; --bg:#f4f7fa; --danger:#b42318; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:#243442; font-family:Tahoma,Arial,sans-serif; font-size:13px; }
    .shell { padding:20px; }
    .header,.toolbar,.actions,.modal-actions { display:flex; gap:9px; align-items:center; }
    .header { justify-content:space-between; margin-bottom:14px; }
    h1 { margin:0; color:var(--navy); font-size:21px; }
    input,select { padding:9px 10px; border:1px solid var(--line); border-radius:6px; font-family:inherit; }
    button { border:0; border-radius:6px; padding:8px 12px; cursor:pointer; font-family:inherit; }
    .primary { background:var(--blue); color:white; }
    .danger { background:#fee4e2; color:var(--danger); }
    .secondary { background:#e7eef5; color:var(--navy); }
    button:disabled { opacity:.5; cursor:not-allowed; }
    .table-wrap { background:white; border:1px solid var(--line); border-radius:8px; overflow:auto; }
    table { width:100%; border-collapse:collapse; min-width:850px; }
    th,td { padding:11px; border-bottom:1px solid var(--line); text-align:right; }
    th { background:var(--navy); color:white; white-space:nowrap; }
    .notice { display:none; margin:10px 0; padding:10px; border-radius:6px; }
    .notice.ok { display:block; background:#dcf3e5; color:#145c34; }
    .notice.error { display:block; background:#fee4e2; color:#7a271a; }
    .badge { border-radius:12px; padding:3px 8px; background:#dcf3e5; color:#145c34; }
    dialog { border:0; border-radius:9px; box-shadow:0 20px 55px #0004; width:min(520px,calc(100% - 30px)); }
    dialog::backdrop { background:#10283d99; }
    .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    label { display:flex; flex-direction:column; gap:5px; }
    .wide { grid-column:1/-1; }
    .modal-actions { justify-content:flex-start; margin-top:16px; }
    @media(max-width:700px){.header{align-items:stretch;flex-direction:column}.toolbar{flex-wrap:wrap}.form-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<main class="shell">
  <div class="header">
    <h1>مدیریت شرکت‌ها <span id="count"></span></h1>
    <div class="toolbar">
      <input id="search" type="search" placeholder="جستجو">
      <button id="create" class="primary" type="button">شرکت جدید</button>
      <button id="refresh" class="secondary" type="button">بازخوانی</button>
    </div>
  </div>
  <div id="notice" class="notice" role="status"></div>
  <div class="table-wrap"><table><thead><tr><th>#</th><th>نام</th><th>نوع حقوقی</th><th>شماره ثبت</th><th>شناسه ملی</th><th>تلفن</th><th>وضعیت</th><th>عملیات</th></tr></thead><tbody id="body"></tbody></table></div>
</main>

<dialog id="formDialog">
  <form id="companyForm">
    <h2 id="formTitle">شرکت</h2>
    <input id="recordId" type="hidden">
    <div class="form-grid">
      <label class="wide">نام شرکت<input id="nameFa" maxlength="255" required></label>
      <label>نوع حقوقی<select id="legalType"><option value="private_llc">با مسئولیت محدود</option><option value="private_joint_stock">سهامی خاص</option><option value="public_joint_stock">سهامی عام</option><option value="cooperative">تعاونی</option><option value="other">سایر</option></select></label>
      <label>شماره ثبت<input id="registrationNumber" maxlength="50"></label>
      <label>شناسه ملی<input id="nationalId" maxlength="50"></label>
      <label>تلفن<input id="phone" maxlength="50"></label>
    </div>
    <div class="modal-actions"><button class="primary" type="submit">ذخیره</button><button class="secondary" type="button" data-close="formDialog">انصراف</button></div>
  </form>
</dialog>

<dialog id="deleteDialog">
  <h2>حذف شرکت</h2><p>آیا از حذف «<strong id="deleteName"></strong>» مطمئن هستید؟</p>
  <div class="modal-actions"><button id="confirmDelete" class="danger" type="button">حذف</button><button class="secondary" type="button" data-close="deleteDialog">انصراف</button></div>
</dialog>

<script>
(function(){
  'use strict';
  var API=window.EMCORE_COMPANIES_API||'/emcore_api/emcore_companies_api.php';
  var csrf='',all=[],deleteId=null;
  var types={private_llc:'با مسئولیت محدود',private_joint_stock:'سهامی خاص',public_joint_stock:'سهامی عام',cooperative:'تعاونی',other:'سایر'};
  function call(params){return fetch(API,{method:'POST',credentials:'same-origin',headers:csrf?{'X-CSRF-Token':csrf}:{},body:new URLSearchParams(params)}).then(function(r){return r.json().catch(function(){throw new Error('پاسخ نامعتبر از سرور');}).then(function(j){if(!r.ok||!j.success)throw new Error(j.error||'خطای سرور');return j;});});}
  function notice(message,type){var n=document.getElementById('notice');n.textContent=message;n.className='notice '+type;}
  function cell(tr,value,strong){var td=document.createElement('td'),node=strong?document.createElement('strong'):document.createTextNode(value==null||value===''?'—':String(value));if(strong)node.textContent=value||'—';td.appendChild(node);tr.appendChild(td);}
  function render(rows){var body=document.getElementById('body');body.textContent='';document.getElementById('count').textContent='('+rows.length+' مورد)';rows.forEach(function(c,i){var tr=document.createElement('tr');cell(tr,i+1);cell(tr,c.name_fa,true);cell(tr,types[c.legal_type]||c.legal_type);cell(tr,c.registration_number);cell(tr,c.national_id);cell(tr,c.phone);var status=document.createElement('td'),badge=document.createElement('span');badge.className='badge';badge.textContent=Number(c.is_active)===1?'فعال':'غیرفعال';status.appendChild(badge);tr.appendChild(status);var actions=document.createElement('td'),wrap=document.createElement('div');wrap.className='actions';var edit=document.createElement('button');edit.type='button';edit.className='secondary';edit.textContent='ویرایش';edit.addEventListener('click',function(){openEdit(c.id);});wrap.appendChild(edit);if(Number(c.is_active)===1){var del=document.createElement('button');del.type='button';del.className='danger';del.textContent='حذف';del.addEventListener('click',function(){deleteId=c.id;document.getElementById('deleteName').textContent=c.name_fa;document.getElementById('deleteDialog').showModal();});wrap.appendChild(del);}actions.appendChild(wrap);tr.appendChild(actions);body.appendChild(tr);});}
  function load(){call({action:'list'}).then(function(j){all=j.data;csrf=j.csrf_token;render(all);}).catch(function(e){notice(e.message,'error');});}
  function openCreate(){document.getElementById('formTitle').textContent='شرکت جدید';document.getElementById('companyForm').reset();document.getElementById('recordId').value='';document.getElementById('formDialog').showModal();}
  function openEdit(id){call({action:'get',id:id}).then(function(j){var c=j.data;document.getElementById('formTitle').textContent='ویرایش شرکت';document.getElementById('recordId').value=c.id;document.getElementById('nameFa').value=c.name_fa||'';document.getElementById('legalType').value=c.legal_type||'other';document.getElementById('registrationNumber').value=c.registration_number||'';document.getElementById('nationalId').value=c.national_id||'';document.getElementById('phone').value=c.phone||'';document.getElementById('formDialog').showModal();}).catch(function(e){notice(e.message,'error');});}
  document.getElementById('companyForm').addEventListener('submit',function(e){e.preventDefault();var id=document.getElementById('recordId').value;call({action:id?'update':'create',id:id,csrf_token:csrf,name_fa:document.getElementById('nameFa').value,legal_type:document.getElementById('legalType').value,reg_number:document.getElementById('registrationNumber').value,national_id:document.getElementById('nationalId').value,phone:document.getElementById('phone').value}).then(function(){document.getElementById('formDialog').close();notice('اطلاعات ذخیره شد','ok');load();}).catch(function(error){notice(error.message,'error');});});
  document.getElementById('confirmDelete').addEventListener('click',function(){if(!deleteId)return;call({action:'delete',id:deleteId,csrf_token:csrf}).then(function(){document.getElementById('deleteDialog').close();deleteId=null;notice('شرکت حذف شد','ok');load();}).catch(function(e){notice(e.message,'error');});});
  document.getElementById('search').addEventListener('input',function(e){var q=e.target.value.trim();render(!q?all:all.filter(function(c){return[c.name_fa,c.national_id,c.registration_number].some(function(v){return v&&String(v).indexOf(q)!==-1;});}));});
  document.getElementById('create').addEventListener('click',openCreate);document.getElementById('refresh').addEventListener('click',load);document.querySelectorAll('[data-close]').forEach(function(b){b.addEventListener('click',function(){document.getElementById(b.dataset.close).close();});});load();
}());
</script>
</body>
</html>
